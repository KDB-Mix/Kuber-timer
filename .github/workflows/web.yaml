name: Deploy Tauri Frontend to GitHub Pages

on:
  push:
    branches:
      - stable

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Build frontend website
        run: yarn run build
        env:
          VITE_GH_PAGES: 'true'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Use the official Pages-specific upload action
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: "github-pages"
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
